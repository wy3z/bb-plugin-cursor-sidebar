<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Resting/resolved prototype</title>
<style>
  :root { --fg:oklch(81% 0 0); --muted:oklch(78% 0 0); --subtle:oklch(68% 0 0); --warn:oklch(75% .16 50); --bg:oklch(19.5% 0 0); --rowbg:oklch(23% 0 0); --rowhov:oklch(26% 0 0); }
  .light { --fg:oklch(32% 0 0); --muted:oklch(44% 0 0); --subtle:oklch(50% 0 0); --warn:oklch(55% .14 50); --bg:oklch(100% 0 0); --rowbg:oklch(97% 0 0); --rowhov:oklch(94% 0 0); }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:12px/1.4 -apple-system,"Segoe UI",Roboto,Sans-serif; }
  h2 { font-size:12px; margin:14px 0 6px; color:var(--subtle); }
  .panel { border:1px solid color-mix(in oklch, var(--fg) 12%, transparent); border-radius:8px; padding:8px 12px; margin-bottom:12px; background:var(--rowbg); }
  .r { display:flex; align-items:center; gap:8px; padding:3px 6px; border-radius:5px; width:230px; }
  .r.sel { background:var(--rowhov); }
  .lbl { width:96px; font-size:11px; color:var(--subtle); }
  .slot { flex:0 0 auto; width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; }
  .nm { font-size:11px; color:var(--muted); }
  svg { display:block; }
  .m40 { color:color-mix(in oklch, var(--muted) 40%, transparent); }
  .m50 { color:color-mix(in oklch, var(--muted) 50%, transparent); }
  .m60 { color:color-mix(in oklch, var(--muted) 60%, transparent); }
  .fg { color:var(--fg); }
  .warn { color:var(--warn); }
  .dot { display:block; border-radius:9999px; background:color-mix(in oklch, var(--muted) 50%, transparent); }
</style></head><body>
<h2>Resting / resolved prototype — actual size, DPR1</h2>
<div id="app"></div>
<script>
const ICONS = {"Circle":[["circle",{"cx":"12","cy":"12","r":"10","stroke":"currentColor","strokeLinejoin":"round","strokeWidth":"1.5","key":"0"}]],"CircleCheck":[["path",{"d":"M22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12Z","stroke":"currentColor","strokeWidth":"1.5","key":"0"}],["path",{"d":"M8 12.5L10.5 15L16 9","stroke":"currentColor","strokeLinecap":"round","strokeLinejoin":"round","strokeWidth":"1.5","key":"1"}]],"AlertTriangle":[["path",{"d":"M13.9248 21H10.0752C5.44476 21 3.12955 21 2.27636 19.4939C1.42317 17.9879 2.60736 15.9914 4.97574 11.9985L6.90057 8.75333C9.17559 4.91778 10.3131 3 12 3C13.6869 3 14.8244 4.91777 17.0994 8.75332L19.0243 11.9985C21.3926 15.9914 22.5768 17.9879 21.7236 19.4939C20.8704 21 18.5552 21 13.9248 21Z","stroke":"currentColor","strokeLinecap":"round","strokeLinejoin":"round","strokeWidth":"1.5","key":"0"}],["path",{"d":"M12 9V13","stroke":"currentColor","strokeLinecap":"round","strokeLinejoin":"round","strokeWidth":"1.5","key":"1"}],["path",{"d":"M12.125 16.75H12M12.25 16.75C12.25 16.8881 12.1381 17 12 17C11.8619 17 11.75 16.8881 11.75 16.75C11.75 16.6119 11.8619 16.5 12 16.5C12.1381 16.5 12.25 16.6119 12.25 16.75Z","stroke":"currentColor","strokeLinecap":"round","strokeLinejoin":"round","strokeWidth":"1.5","key":"2"}]],"Loading":[["path",{"d":"M12 3V6","stroke":"currentColor","strokeLinecap":"round","strokeWidth":"1.5","key":"0"}],["path",{"d":"M12 18V21","stroke":"currentColor","strokeLinecap":"round","strokeWidth":"1.5","key":"1"}],["path",{"d":"M21 12L18 12","stroke":"currentColor","strokeLinecap":"round","strokeWidth":"1.5","key":"2"}],["path",{"d":"M6 12L3 12","stroke":"currentColor","strokeLinecap":"round","strokeWidth":"1.5","key":"3"}],["path",{"d":"M18.3635 5.63672L16.2422 7.75804","stroke":"currentColor","strokeLinecap":"round","strokeWidth":"1.5","key":"4"}],["path",{"d":"M7.75804 16.2422L5.63672 18.3635","stroke":"currentColor","strokeLinecap":"round","strokeWidth":"1.5","key":"5"}],["path",{"d":"M18.3635 18.3635L16.2422 16.2422","stroke":"currentColor","strokeLinecap":"round","strokeWidth":"1.5","key":"6"}],["path",{"d":"M7.75804 7.75804L5.63672 5.63672","stroke":"currentColor","strokeLinecap":"round","strokeWidth":"1.5","key":"7"}]],"CircleQuestion":[["circle",{"cx":"12","cy":"12","r":"10","stroke":"currentColor","strokeLinecap":"round","strokeLinejoin":"round","strokeWidth":"1.5","key":"0"}],["path",{"d":"M9.5 9.5C9.5 8.11929 10.6193 7 12 7C13.3807 7 14.5 8.11929 14.5 9.5C14.5 10.3569 14.0689 11.1131 13.4117 11.5636C12.7283 12.0319 12 12.6716 12 13.5","stroke":"currentColor","strokeLinecap":"round","strokeLinejoin":"round","strokeWidth":"1.5","key":"1"}],["path",{"d":"M12.125 16.75H12M12.25 16.75C12.25 16.8881 12.1381 17 12 17C11.8619 17 11.75 16.8881 11.75 16.75C11.75 16.6119 11.8619 16.5 12 16.5C12.1381 16.5 12.25 16.6119 12.25 16.75Z","stroke":"currentColor","strokeLinecap":"round","strokeLinejoin":"round","strokeWidth":"1.5","key":"2"}]]};
function svg(name, S, cls, filled) {
  const parts = ICONS[name].map(([tag, attrs]) => {
    const a = Object.entries(attrs).filter(([k]) => k !== "key").map(([k,v]) => k+'="'+v+'"').join(" ");
    return "<"+tag+" "+a+"/>";
  }).join("");
  return '<svg width="'+S+'" height="'+S+'" viewBox="0 0 24 24" fill="'+(filled?"currentColor":"none")+'" class="'+cls+'">'+parts+'</svg>';
}
function dot(S, cls) { const px = Math.max(4, Math.round(S*0.32)); return '<span class="dot '+cls+'" style="width:'+px+'px;height:'+px+'px"></span>'; }
const SIZES = [12,14,16];
const treatments = [
  ["A ring→check", (S)=>svg("Circle",S,"m40"), (S)=>svg("CircleCheck",S,"fg")],
  ["B dot→check", (S)=>dot(S,""), (S)=>svg("CircleCheck",S,"fg")],
  ["C ring→disc", (S)=>svg("Circle",S,"m40"), (S)=>svg("Circle",S,"fg",true)],
  ["D ring→ring", (S)=>svg("Circle",S,"m40"), (S)=>svg("Circle",S,"fg")],
];
function panel(light){
  let h = '<div class="panel '+(light?"light":"")+'">';
  // working + issue reference
  h += '<div class="r"><span class="lbl">working (native)</span>';
  for (const S of SIZES) h += '<span class="slot">'+svg("Loading",S,"m50")+'</span>';
  h += '</div>';
  h += '<div class="r"><span class="lbl">issue: Triangle</span>';
  for (const S of SIZES) h += '<span class="slot">'+svg("AlertTriangle",S,"warn")+'</span>';
  h += '</div>';
  h += '<div class="r"><span class="lbl">issue: Question</span>';
  for (const S of SIZES) h += '<span class="slot">'+svg("CircleQuestion",S,"m60")+'</span>';
  h += '</div>';
  for (const [label, rest, res] of treatments) {
    h += '<div class="r"><span class="lbl">'+label+' rest</span>';
    for (const S of SIZES) h += '<span class="slot">'+rest(S)+'</span>';
    h += '</div>';
    h += '<div class="r sel"><span class="lbl">'+label+' resolv</span>';
    for (const S of SIZES) h += '<span class="slot">'+res(S)+'</span>';
    h += '</div>';
  }
  return h + '</div>';
}
document.getElementById("app").innerHTML = '<h2>Dark</h2>'+panel(false)+'<h2>Light</h2>'+panel(true)+
  '<h2>Size key</h2><div class="panel"><div class="r"><span class="lbl">columns</span><span class="nm">12px / 14px / 16px</span></div></div>';
</script></body></html>
